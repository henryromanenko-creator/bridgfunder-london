

    <div id="cookie-consent-banner" class="fixed bottom-0 left-0 right-0 z-[10000] p-4 md:p-6 translate-y-full transition-transform duration-500 ease-in-out">
        <div class="max-w-4xl mx-auto bg-white/95 border border-navy/10 rounded-2xl p-6 shadow-2xl flex flex-col md:flex-row items-center gap-6" style="backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
            <div class="flex-1">
                <h4 class="text-[#0A192F] font-bold mb-1 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A192F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"></path><path d="M8.5 8.5v.01"></path><path d="M16 15.5v.01"></path><path d="M12 12v.01"></path><path d="M11 17v.01"></path><path d="M7 14v.01"></path></svg>
                    Data & Privacy Consent
                </h4>
                <p class="text-[#0A192F] text-xs md:text-sm leading-relaxed font-semibold">
                    We use cookies to analyze site traffic and optimize your experience. By clicking "Accept All", you agree to our use of cookies as described in our 
                    <a href="legal.html" class="text-blue-700 hover:underline font-bold">Privacy Policy</a>.
                </p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="acceptCookies()" class="flex-1 md:flex-none bg-[#0A192F] hover:bg-black text-white font-bold py-3 px-8 rounded-lg transition-all shadow-lg active:scale-95 text-sm">
                    Accept All
                </button>
            </div>
        </div>
    </div>

    <script>
        function showBanner() {
            const banner = document.getElementById('cookie-consent-banner');
            if (!localStorage.getItem('bridgfunder_consent')) {
                setTimeout(() => {
                    banner.classList.remove('translate-y-full');
                }, 1500);
            }
        }

        function acceptCookies() {
            const banner = document.getElementById('cookie-consent-banner');
            localStorage.setItem('bridgfunder_consent', 'true');
            
            // WAKE UP GOOGLE ANALYTICS
            gtag('consent', 'update', {
              'ad_storage': 'granted',
              'analytics_storage': 'granted'
            });

            banner.classList.add('translate-y-full');
        }

        document.addEventListener('DOMContentLoaded', showBanner);
    </script>
</body>
</html>
